<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貴金屬歷史監報</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .chart-container { position: relative; height: 300px; width: 100%; margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #fafafa; }
    </style>
</head>
<body>
    <div class="container">
        <h2>💎 實時報價與歷史走勢</h2>
        <table>
            <thead><tr><th>項目</th><th>原始 (盎司)</th><th>換算 (公克/台兩)</th></tr></thead>
            <tbody>{tw_content}</tbody>
        </table>

        <div class="chart-container"><canvas id="goldChart"></canvas></div>
        <div class="chart-container"><canvas id="silverChart"></canvas></div>
        <div class="chart-container"><canvas id="usdChart"></canvas></div>

        <p style="font-size: 12px; color: #999; text-align: center;">最後更新: {update_time} (UTC)</p>
    </div>

    <script>
        const rawData = {history_json};
        const labels = rawData.map(d => d.time);

        function createChart(id, label, data, color) {
            new Chart(document.getElementById(id), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{ label: label, data: data, borderColor: color, fill: false, tension: 0.1 }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        createChart('goldChart', '黃金 (TWD/oz)', rawData.map(d => d.gold), '#d4af37');
        createChart('silverChart', '白銀 (TWD/oz)', rawData.map(d => d.silver), '#999');
        createChart('usdChart', '美匯 (TWD)', rawData.map(d => d.usd), '#2ecc71');
    </script>
</body>
</html>
