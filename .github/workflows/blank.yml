name: Update Metal Price

on:
  schedule:
    # 這裡設定每分鐘執行一次 (雖然會有延遲)
    - cron: '* * * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允許手動點擊執行

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予寫入權限，才能把更新後的 HTML 推回 Repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python update_price.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # 只有當檔案有變動時才 commit，避免報錯
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update price: $(date)" && git push)
