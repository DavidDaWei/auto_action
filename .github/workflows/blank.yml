name: Update Metal Price

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python update_price.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 先把改動過的檔案加入暫存區
          git add index.html data.json
          
          # 2. 檢查有沒有檔案變動，如果有才執行 Commit 與 Push
          if ! git diff --staged --quiet; then
            git commit -m "Update prices and charts: $(date)"
            
            # 3. 關鍵：Commit 完後再執行 rebase，把遠端的紀錄拉下來接在剛才的 commit 之前
            git pull --rebase origin main
            
            # 4. 推送到 GitHub
            git push
          else
            echo "No changes detected, skipping push."
          fi
