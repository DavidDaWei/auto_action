name: Update Metal Price

on:
  schedule:
    - cron: '*/5 * * * *' # 改為每 5 分鐘跑一次比較穩，GitHub 比較不會阻擋
  push:
    branches: [ "main" ]
  workflow_dispatch: 

env:
  # 解決你看到的 Node.js 20 警告，強制使用 Node 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python update_price.py


      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 關鍵：先拉取最新變更防止衝突
          git pull origin main --rebase
          git add index.html data.json
          git commit -m "Update history and charts: $(date)" || echo "No changes"
          git push
